[package]
name = "fast-fps"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "0.20.1", features = ["serialize", "ktx2", "zstd_rust", "wav"] }
avian3d = { version = "0.8", features = ["serialize", "bevy_diagnostic"] }
bevy_ahoy = { version = "0.3", default-features = false }
bevy_enhanced_input = "0.27"
bevy_replicon = "0.45"
bevy_replicon_renet2 = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ehttp = { version = "0.7", features = ["json"] }
rand = "0.9"
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }

# Natively: UDP for players, plus a WebTransport socket for browser players on
# dedicated servers, which runs on tokio (net/transport.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_replicon_renet2 = { version = "1.0.1", features = ["native_transport", "wt_server_transport"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Only in the browser build (`scripts/web.sh`, docs/web.md). Randomness comes
# from the browser's crypto API (two getrandom versions are in the tree), and
# web-sys reaches the page: localStorage, the URL, pointer lock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "Storage", "console"] }
bevy_replicon_renet2 = { version = "1.0.1", features = ["wt_client_transport"] }
web-time = "1"

[workspace]
# The lobby (`lobby/`) is its own small program, with no Bevy in it.
members = ["lobby"]

[features]
default = ["dev"]
dev = ["bevy/dynamic_linking", "bevy/file_watcher", "bevy/track_location"]
# The browser build: WebGPU. Built with --no-default-features --features web.
web = ["bevy/webgpu", "bevy/web"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

# The browser build (scripts/web.sh): optimized for size, since the browser
# downloads all of it before the game starts.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"

# Optimize for build time in CI.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
