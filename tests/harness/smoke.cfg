// The quickest end-to-end check: the game starts, draws, answers commands,
// spawns a bot and fires. Run this first after any change.
wait_until grounded == 1 5
state
assert mode == offline
assert players == 1
assert health == 100
assert weapon == ak
assert ammo == 30
screenshot boot
bot
assert bots == 1
assert players == 2
fire 3
wait_until ammo == 27 3
quit
