// The knife and the grenade against pinned bots: two slashes kill face to
// face, one from behind, a stab does 65; a grenade hurts its thrower, kills
// a softened bot next to it, and comes back after a respawn.
r_ambient 12
r_viewmodel 1
sky day
tp 0 1.2 17
look 0 -10
weapon knife
wait 0.8
assert weapon == knife
assert ammo == 0

// Face to face: one slash isn't enough, two are.
bot 0 0.9 15.6 180
bot_do all pin
wait 0.5
fire 1
wait 0.12
screenshot knife_slash
wait 0.6
assert kills == 0
fire 1
wait_until kills == 1 2
bot_do all remove

// From behind: one slash.
bot 0 0.9 15.6 0
bot_do all pin
wait 0.5
fire 1
wait_until kills == 2 2
bot_do all remove

// Stab: 65 damage, so it takes two face to face.
bot 0 0.9 15.6 180
bot_do all pin
wait 0.5
fire_alt 1
wait 0.15
screenshot knife_stab
wait 1.1
assert kills == 2
fire_alt 1
wait_until kills == 3 2
bot_do all remove

// Grenade. Soften a bot with two rifle hits, then lob a grenade at our own
// feet beside it: it kills the bot and badly hurts us.
weapon grenade
wait 0.7
assert ammo == 1
screenshot grenade_held
weapon ak
bot 0 0.9 13 180
bot_do all pin
tp 0 1.2 17
look 0 -9
wait 0.8
fire 2
wait 0.6
assert kills == 3
tp 1.0 1.2 13.4
look 0 -89
weapon grenade
wait 0.7
// A scripted click holds for a full charge (0.8 s), then lets go.
fire_alt 1
wait 0.4
screenshot grenade_charging
wait 0.65
assert ammo == 0
assert grenades == 1
look 0 -20
wait_until explosions == 1 4
wait 0.05
screenshot grenade_blast
wait 0.4
assert grenades == 0
assert kills == 4
assert health < 40
assert health > 0
wait 1
screenshot grenade_smoke
assert weapon == ak

// Holding longer throws farther. A new life brings a new grenade: tap one
// from the yard, then die, come back and throw one at full strength.
kill
wait 1
tp 0 1.2 22
look 0 -10
weapon grenade
wait 0.7
assert ammo == 1
fire_hold 0.05
wait_until explosions == 2 5
assert blast_z > 13.5
kill
wait 1
tp 0 1.2 22
look 0 -10
weapon grenade
wait 0.7
fire_hold 1.0
wait_until explosions == 3 6
assert blast_z < 10
// One more, lobbed into the yard, to watch from a little way off and to
// measure the frame time around the blast.
kill
wait 1
tp 0 1.2 22
look 0 -4
weapon grenade
wait 0.7
perf_reset
fire_alt 1
wait_until explosions == 4 6
wait 0.05
screenshot grenade_far
wait 0.5
screenshot grenade_far_smoke
perf grenade
quit
