// Kill a bot with each kind of hit, check a ragdoll appears each time, and
// check they all fade away afterwards.
r_ambient 12
r_viewmodel 0
tp 0 1.2 17
look 0 -6
bot -2 0.9 11 180
bot 0 0.9 11 180
bot 2 0.9 11 180
bot_do all pin
bot_do 1 run
bot_do 3 crouch
wait 1
screenshot a_before
assert ragdolls == 0

// Sniper to the middle bot's chest, straight on.
weapon sniper
wait 1.0
zoom 1
wait 0.4
fire 1
wait_until ragdolls == 1 3
assert kills == 1
screenshot b_hit
zoom 0
wait 0.4
screenshot c_falling
wait 3
screenshot d_settled

// Shotgun the running bot, then AK the crouching one.
weapon shotgun
tp -2 1.2 14.5
look 0 -6
wait 0.8
fire 1
wait_until ragdolls == 2 3
weapon ak
tp 2 1.2 15
look 0 -12
wait 0.7
fire 8
wait_until ragdolls == 3 3
assert kills == 3
tp 0 1.2 17
look 0 -6
wait 3
screenshot e_three_settled
tp 4.5 1.6 9.5
look 75 -14
wait 0.4
screenshot f_other_angle

// Corpses fade after 12 seconds.
wait_until ragdolls == 0 20
screenshot g_faded
quit
