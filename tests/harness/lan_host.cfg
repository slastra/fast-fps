// LAN test, host side. Run with lan_client.cfg after it:
//   scripts/harness.sh tests/harness/lan_host.cfg tests/harness/lan_client.cfg
// Uses its own port so it can run while a real game is hosting.
host 27555
r_ambient 12
r_viewmodel 0
tp 0 1.2 20.5
look 0 -5
bot -1.5 0.9 11 180
bot 1.5 0.9 11 180
wait 0.2
bot_do all pin
bot_do 1 walk
bot_do 2 crouch
wait 9.6
screenshot host_before
wait 2.2
screenshot host_sees_ragdoll
status
wait 4
quit
