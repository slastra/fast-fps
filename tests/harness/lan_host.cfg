// LAN test, host side. Run together with lan_client.cfg:
//   scripts/harness.sh tests/harness/lan_host.cfg tests/harness/lan_client.cfg
// Uses its own port so it can run while a real game is hosting.
host 27555
assert mode == hosting
r_ambient 12
r_viewmodel 0
tp 0 1.2 20.5
look 0 -5
bot -1.5 0.9 11 180
bot 1.5 0.9 11 180
bot_do all pin
bot_do 1 walk
bot_do 2 crouch
// Me, two bots, and the client.
wait_until players == 4 60
wait 1.5
screenshot host_before
// The client kills a bot; its corpse must show up here too.
wait_until ragdolls == 1 30
wait 1.5
screenshot host_sees_ragdoll
// Then the client's grenade goes off here too.
wait_until explosions == 1 30
look -25 -10
wait 1.2
screenshot host_sees_knife
status
// A duel, host against client: the client walks to its mark and wins the
// first round with a headshot after "Draw!".
bot_do all remove
wait_until players == 2 5
mode duel
wait_until duel == walk 5
assert duel_me == duelist
assert duel_slot == 0
// Let the round-start respawn land before stepping onto the mark.
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == steady 20
wait_until duel == draw 5
screenshot host_duel_draw
wait_until duel_wins == 0-1 10
assert out == 1
// Give the client time to see the score before the duel ends.
wait 2
mode ffa
assert duel == none
// Stay up until the client has left.
wait_until players == 1 30
quit
