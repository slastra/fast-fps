// Survival: going down. A bot is your teammate (bots don't count toward
// "everyone is down", so the run goes on without it). A zombie set loose in
// the keep downs the bot; you shoot the zombie when it comes for you; the
// bot bleeds out after 30 s, and comes back at the next breather. Then a
// zombie downs you during a wave: alone, that ends the run, and the next one
// starts over.
r_ambient 12
sky day
mode survival
bot
wait_until survival == wave 8
// Clear wave 1 at once, for a full 15 s breather to work in.
end_wave
wait_until survival == breather 3
assert team_down == 0
// Stand south of the keep, facing its south door.
tp 0 0.9 16
look 0 0
bot_do all pin
zombie walker 0 0
wait_until team_down == 1 15
assert fallen == 0
// The zombie leaves the bot be and comes out of the door at you.
wait_until zombie_near < 7 15
screenshot survival_out_the_door
look 0 -4
wait_until zombie_near < 4.5 5
fire 10
wait_until kills == 1 3
assert health > 0
// The bot bleeds out during wave 2, while you wait in a far corner.
tp -30 0.9 30
look 135 0
wait_until survival == wave 15
wait_until team_out == 1 32
assert team_down == 0
end_wave
wait_until survival == breather 3
assert team_out == 0
assert team_down == 0

// Now you, in wave 3: a zombie in front of you. Down, and alone, so the run
// is over. Your gun does nothing while you're down.
weapon glock
reload
wait 2
assert ammo == 20
next_wave
wait_until survival == wave 3
zombie walker
wait_until fallen == 1 15
assert health == 1
wait_until survival == over 2
fire 1
wait 0.4
assert ammo == 20
wait 0.6
screenshot survival_downed
// The next run starts from nothing.
wait_until survival == breather 15
assert wave == 0
assert fallen == 0
assert health == 100
assert cards == 0
assert team_down == 0
quit
