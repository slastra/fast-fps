// LAN test, client side: join, watch the host's bots animate from replicated
// poses, then scope in and kill the walking one.
connect 127.0.0.1:27555
wait_until mode == client 20
wait_until players == 4 10
r_ambient 12
r_viewmodel 0
tp 3 1.2 16
look 31 -6
weapon sniper
wait 2.5
screenshot client_sees_bots
look 42 -5
zoom 1
wait 0.5
fire 1
wait_until kills == 1 5
wait_until ragdolls == 1 3
screenshot client_ragdoll_falling
zoom 0
wait 2
screenshot client_ragdoll_settled
status
// Give the host time to take its own screenshot.
wait 2.5
disconnect
wait_until mode == offline 5
quit
