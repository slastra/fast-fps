// LAN test, client side: join, watch the host's bots animate from replicated
// poses, scope in and kill the walking one, then throw a grenade.
connect 127.0.0.1:27555
wait_until mode == client 20
wait_until players == 4 10
r_ambient 12
r_viewmodel 0
tp 3 1.2 16
look 31 -6
weapon sniper
wait 2.5
screenshot client_sees_bots
look 42 -5
zoom 1
wait 0.5
fire 1
wait_until kills == 1 5
wait_until ragdolls == 1 3
screenshot client_ragdoll_falling
zoom 0
wait 2
screenshot client_ragdoll_settled
// A grenade: the host simulates it, this client must see it fly and go off.
weapon grenade
wait 0.7
look 40 -15
fire 1
wait_until grenades == 1 2
wait_until explosions == 1 5
wait 0.1
screenshot client_grenade
// Hold the knife so the host can see it in our hand.
weapon knife
status
// Give the host time to take its own screenshot.
wait 2.5
// The host starts a duel: walk to the far mark, face the host, draw and
// fire at "Draw!". The duel's state is replicated, so this side sees it too.
wait_until duel == walk 15
assert duel_me == duelist
assert duel_slot == 1
assert weapon == flintlock
// Let the round-start respawn land before stepping onto the mark.
wait 0.5
tp 0 0.9 21
look 0 0
wait_until duel == steady 10
fire 1
wait 0.5
assert ammo == 1
wait_until duel == draw 5
assert holstered == 1
draw
wait 0.6
fire 1
wait_until duel_wins == 0-1 5
wait 0.2
screenshot client_duel_won
// The host's body has fallen and the host itself isn't drawn.
wait 1.5
screenshot client_duel_fallen
wait_until duel == none 15
disconnect
wait_until mode == offline 5
quit
