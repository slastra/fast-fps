// Spray every weapon at the lamp-lit north wall from 7 m without pulling
// down, then screenshot the holes with the crosshair back on the aim point.
// Best at a large size: scripts/harness.sh -s 1920x1080 tests/harness/spray.cfg
weapon ak
tp -15 1.2 -29
look 0 0
wait_until grounded == 1 5
wait 1
assert spread < 0.5
fire 30
wait 1.2
screenshot ak_mid_spray
assert spread > 1
wait_until ammo == 0 5
assert decals >= 28
wait 1.5
screenshot ak_spray

weapon mp5
tp -9 1.2 -29
look 0 0
wait 1
fire 30
wait_until ammo == 0 5
wait 1.5
screenshot mp5_spray

weapon glock
tp -3 1.2 -29
look 0 0
wait 1
fire 20
wait_until ammo == 0 6
wait 1.5
screenshot glock_spray

weapon shotgun
tp 5 1.2 -29
look 0 0
wait 1
fire 1
wait 1.2
assert ammo == 7
screenshot shotgun_blast

// The sniper is only accurate scoped and standing still.
weapon sniper
tp 11 1.2 -29
look 0 0
wait 1.2
assert spread > 5
screenshot sniper_unscoped
zoom 1
wait 0.6
assert scoped == 1
assert spread < 0.5
screenshot sniper_scoped
fire 1
wait 0.3
zoom 0
tp 11 6 -29
wait 0.15
assert grounded == 0
assert spread > 10
screenshot sniper_airborne
quit
