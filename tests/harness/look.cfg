// The look of the game: the same viewpoints under every sky, then close-ups.
// This one is for looking at: open the screenshots.
r_viewmodel 0
tp -24 1.2 -4
look -115 4
wait 1
sky dusk
wait 0.3
screenshot dusk_keep
sky night
wait 0.3
screenshot night_keep
sky dawn
wait 0.3
screenshot dawn_keep
sky day
wait 0.3
screenshot day_keep
assert sky == day

// Close-ups in daylight, where geometry is easiest to judge.
tp 6.5 1.2 -14.5
look -125 -8
wait 0.4
screenshot day_crates
tp 0 1.2 12
look 0 6
wait 0.4
screenshot day_door
tp -8 1.2 29
look 200 8
wait 0.4
screenshot day_wall

// Toward the sun and the moon.
sky dusk
tp 10 1.2 20
look 70 8
wait 0.4
screenshot dusk_sun
tp 3 1.2 9.5
look 15 0
wait 0.4
screenshot dusk_fire
sky night
tp 14 1.2 22
look 40 16
wait 0.4
screenshot night_moon
quit
