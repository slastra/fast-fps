// Survival's crawler, bloater and leaper, each set loose with the zombie
// command in the yard south of the keep and checked as it behaves.
r_ambient 12
sky day
mode survival
wait_until survival == wave 8
end_wave
wait_until survival == breather 3

// Crawler: low to the ground; shoot low.
tp 0 0.9 18
look 0 -8
zombie crawler 0 12.5
wait 0.6
assert crawling == 1
screenshot survival_crawler
// It's hard to hit coming in fast and low; shoot it where it stops.
wait_until zombie_near < 1.5 5
look 0 -45
fire 4
wait_until kills == 1 3
end_wave

// Bloater, shot at range: it bursts into gas.
give_card Patch Up
tp 0 0.9 18
look 0 -2
zombie bloater 0 10
wait 0.5
screenshot survival_bloater
fire 10
wait_until gases == 1 4
wait 0.4
screenshot survival_gas
end_wave
// Another, reaching you: it bursts on you.
give_card Patch Up
wait 4
zombie bloater 0 14.5
wait_until gases == 2 10
wait 0.3
assert health < 80
end_wave

// Leaper: crouches (the tell), then leaps on you. (Once the gas clears.)
give_card Patch Up
wait 4
tp 0 0.9 18
look 0 0
zombie leaper 0 11
wait_until tells == 1 5
screenshot survival_leaper_tell
wait_until leaping == 1 2
wait 0.1
screenshot survival_leaper_air
wait_until health < 80 3
end_wave
quit
