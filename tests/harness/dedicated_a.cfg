// Two players on a dedicated server, which is already running a duel.
// Run as:
//   scripts/harness.sh -S "--port 27591 +mode duel" tests/harness/dedicated_a.cfg tests/harness/dedicated_b.cfg
// This side arrives first, so it is the first duelist (slot 0). It walks to
// its mark and loses the round to the other side's shot.
connect 127.0.0.1:27591
wait_until mode == client 20
r_ambient 12
sky day
// Nobody else: a dedicated server has no player of its own.
wait_until players == 2 30
wait_until duel == walk 10
assert duel_me == duelist
assert duel_slot == 0
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == steady 15
wait_until duel == draw 5
assert holstered == 1
wait 0.3
screenshot dedicated_draw
wait_until duel_wins == 0-1 8
// Give the other side time to see the score before leaving.
wait 2
disconnect
wait_until mode == offline 5
quit
