// The native player in mixed_browser.cfg's game: joins the browser's duel
// through the same lobby, over UDP, and wins the first round.
lobby http://127.0.0.1:8098
games
wait_until lobby_games == 1 10
join mixed
wait_until mode == client 20
sky day
wait_until players == 2 10
wait_until duel == walk 10
assert duel_slot == 1
wait 0.5
tp 0 0.9 21
look 0 0
wait_until duel == steady 20
wait_until duel == draw 5
draw
wait 0.6
fire 1
wait_until duel_wins == 0-1 5
wait 0.3
screenshot mixed_native
wait_until duel == none 15
quit
