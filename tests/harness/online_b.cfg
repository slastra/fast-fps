// The second player online (see online_a.cfg): finds the game in the lobby,
// joins it by name, and wins the first round of the duel.
lobby http://127.0.0.1:8099
// Give the first player time to start their game.
wait 4
games
wait_until lobby_games == 1 5
join test
wait_until mode == client 20
r_ambient 12
sky day
wait_until players == 2 30
wait_until duel == walk 10
assert duel_slot == 1
wait 0.5
tp 0 0.9 21
look 0 0
wait_until duel == steady 15
wait_until duel == draw 5
draw
wait 0.6
fire 1
wait_until duel_wins == 0-1 5
wait 0.3
screenshot online_won
wait_until duel == none 10
quit
