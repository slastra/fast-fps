// Survival co-op, client side: step into the south yard, get downed by the
// host's zombie (no moving, no shooting, a bleed-out clock), and be revived
// by the host with 40 health.
connect 127.0.0.1:27556
wait_until mode == client 20
r_ambient 12
wait_until survival == wave 20
wait_until survival == breather 5
assert weapon == glock
assert cards == 0
tp 0 0.9 20
look 180 0
wait_until fallen == 1 20
assert health == 1
assert bleed > 25
fire 1
wait 0.5
assert ammo == 20
screenshot coop_client_downed
wait_until fallen == 0 20
assert health == 40
wait 0.5
screenshot coop_client_revived
disconnect
wait_until mode == offline 5
quit
