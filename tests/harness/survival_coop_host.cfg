// Survival co-op, host side. Run together with survival_coop_client.cfg:
//   scripts/harness.sh tests/harness/survival_coop_host.cfg tests/harness/survival_coop_client.cfg
// A zombie downs the client in the south yard and comes for the host, who
// shoots it, then kneels beside the client and holds E to bring them back.
host 27556
assert mode == hosting
r_ambient 12
sky day
wait_until players == 2 60
mode survival
wait_until survival == wave 8
// Clear wave 1 at once, for a full 15 s breather to work in.
end_wave
wait_until survival == breather 3
tp 3 0.9 14
look 157 -4
// The client has stepped out to (0, 20); set a zombie on it.
wait 1.5
zombie walker 0 24
wait_until team_down == 1 15
wait 0.6
screenshot coop_host_sees_downed
wait_until zombie_near < 4.5 10
fire 10
wait_until kills == 1 3
// Kneel by the client and hold E.
tp 1.3 0.9 20
look 90 -25
wait 0.3
assert helping == 1
revive on
wait 1
screenshot coop_host_reviving
wait_until team_down == 0 5
revive off
assert helping == 0
// Stay up until the client has left.
wait_until players == 1 30
mode ffa
quit
