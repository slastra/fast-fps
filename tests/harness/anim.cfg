// Animation lineup: six pinned bots, left to right:
// idle, walk, run, strafe, backpedal, crouch. Then poses and weapons.
r_ambient 12
r_viewmodel 0
fov 50
tp 0 1.2 16.4
look 0 -9
bot -3.75 0.9 11 180
bot -2.25 0.9 11 180
bot -0.75 0.9 11 180
bot 0.75 0.9 11 180
bot 2.25 0.9 11 180
bot 3.75 0.9 11 180
wait 0.2
bot_do all pin
wait 6
bot_do 2 walk
bot_do 3 run
bot_do 4 strafe
bot_do 5 back
bot_do 6 crouch
wait 1.0
screenshot a_locomotion_1
wait 0.13
screenshot a_locomotion_2
// Three-quarter view of the same thing.
tp -6.5 1.2 13.5
look -62 -9
wait 0.4
screenshot b_side_1
wait 0.13
screenshot b_side_2

// Poses: crouch-walk, jump, reload, look up, look down, pistol.
bot_do all idle
bot_do all stand
bot_do 1 crouch
bot_do 1 walk
bot_do 3 reload
bot_do 4 look 60
bot_do 5 look -60
bot_do 6 weapon glock
wait 0.7
bot_do 2 jump
wait 0.28
screenshot c_poses_side
tp 0 1.2 16.4
look 0 -9
wait 0.9
bot_do 2 jump
wait 0.28
screenshot c_poses_front
wait 1.0

// Every weapon, and firing.
bot_do all idle
bot_do all stand
bot_do all look 0
bot_do 1 weapon ak
bot_do 2 weapon mp5
bot_do 3 weapon glock
bot_do 4 weapon shotgun
bot_do 5 weapon sniper
bot_do 6 weapon ak
tp -6.5 1.2 13.5
look -62 -9
wait 0.8
screenshot d_weapons
bot_do all fire 6
wait 0.22
screenshot e_firing
quit
