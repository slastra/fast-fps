// A browser and a native player in one game. Run both at once:
//   scripts/web-harness.sh -L tests/harness/mixed_browser.cfg &
//   sleep 25; scripts/harness.sh tests/harness/mixed_native.cfg
// This side, in the browser, starts a duel (WebTransport) and runs it; the
// native player joins by name (UDP) and wins the first round.
create duel mixed
wait_until mode == client 20
sky day
wait_until players == 2 90
wait_until duel == walk 10
assert duel_slot == 0
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == steady 20
wait_until duel == draw 5
wait_until duel_wins == 0-1 8
wait 0.3
screenshot mixed_browser
wait 2
mode ffa
wait_until duel == none 5
disconnect
wait_until mode == offline 5
quit
