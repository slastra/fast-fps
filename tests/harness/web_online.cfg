// Online in the browser (scripts/web-harness.sh -L): start a duel through
// the lobby, which connects over WebTransport, add a bot as the game's
// admin and beat it, then leave and see the empty game shut down.
create duel browser duel
wait_until mode == client 20
sky day
wait_until players == 1 10
bot_duel_aim 0
bot
wait_until players == 2 5
wait_until duel == walk 10
assert duel_slot == 0
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == draw 15
draw
wait 0.6
fire 1
wait_until duel_wins == 1-0 5
wait 0.3
screenshot web_online_won
disconnect
wait_until mode == offline 5
// Empty, the game exits on its own (after 6 s under the harness).
wait 9
games
wait_until lobby_games == 0 5
quit
