// Every state of the HUD. Checks what can be checked; the rest is for
// looking at, so open the screenshots.
wait_until grounded == 1 5
tp 0 1.2 17
look 0 -4
wait 0.5
screenshot a_idle

// Switching weapons brings up the slot strip, which then fades.
weapon shotgun
wait 0.7
assert weapon == shotgun
screenshot b_slots
wait 3
screenshot c_slots_faded

// Low ammo, then reloading.
weapon ak
wait 0.6
fire 26
wait_until ammo == 4 5
wait 0.4
screenshot d_low_ammo
reload
wait 1.1
assert reloading == 1
screenshot e_reloading
wait_until ammo == 30 4

// A kill, and a headshot, for the feed.
bot 0 0.9 11 180
bot_do 1 pin
weapon sniper
wait 1
zoom 1
wait 0.4
fire 1
wait_until kills == 1 3
zoom 0
bot -1.5 0.9 11 180
bot_do 2 pin
look 15.2 -0.2
wait 1.6
zoom 1
wait 0.4
fire 1
wait_until kills == 2 3
zoom 0
wait 0.3
screenshot f_feed
scoreboard 1
wait 0.2
screenshot g_scoreboard
scoreboard 0
quit
