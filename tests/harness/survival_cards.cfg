// Survival's cards, taken with give_card and tried on zombies set loose
// with the zombie command. Each part starts a fresh run (mode survival), so
// the cards don't mix. Stand south of the keep, facing it.
r_ambient 12
sky day

// Cards stack up, and a weapon comes with spare rounds.
mode survival
give_card Frost
give_card Twin Belt
give_card Incendiary
wait 0.3
assert cards == 3
assert card_names == frost,twin_belt,incendiary
// A gun comes with spare magazines; levels raise its damage, then its
// magazine.
give_card Shotgun
wait 0.3
assert owned == 3
weapon shotgun
wait 0.6
assert weapon == shotgun
assert spare > 0
give_card Glock I
give_card Glock II
weapon glock
wait 0.6
reload
wait 2
assert ammo == 30

// The draft: offered cards, and taking one.
offer Sniper, Explosive Tip, Hair Trigger
wait 0.4
assert offer == 3
screenshot survival_card_faces
pick 1
wait 0.4
assert offer == 0
assert owned == 4

// Piercing: one shot goes through two zombies standing in a line.
mode survival
wait_until survival == wave 8
end_wave
wait_until survival == breather 3
give_card Piercing
tp 0 0.9 16
look 0 -3
zombie walker 0 12
zombie walker 0 10
wait 0.2
fire 4
wait_until kills == 2 3

// Incendiary and Frost, with a Twin Belt: Thermal Shock. A brute burns and
// slows; the next hit on it spends both in a burst.
mode survival
wait_until survival == wave 8
end_wave
wait_until survival == breather 3
give_card Incendiary
give_card Twin Belt
give_card Frost
tp 0 0.9 18
look 0 -3
zombie brute 0 11
wait 0.2
fire 1
wait 0.4
assert burning == 1
assert chilled == 1
screenshot survival_burning
fire 2
wait 0.4
assert bursts >= 1
end_wave

// Frost and Shock (Shatter): a hit arcs to the zombies standing near, and
// four frost hits freeze a brute solid.
mode survival
wait_until survival == wave 8
end_wave
wait_until survival == breather 3
give_card Frost
give_card Twin Belt
give_card Shock
tp 0 0.9 18
look 0 -3
// The walkers start behind the brute, so it stays in front.
zombie brute 0 11
zombie walker -2 13
zombie walker 2 13
wait 0.2
fire 1
wait 0.1
screenshot survival_shock
assert arcs >= 1
assert chilled >= 1
fire 4
wait_until frozen == 1 2
screenshot survival_frozen
end_wave

// Explosive Tip: shots burst where they hit.
mode survival
wait_until survival == wave 8
end_wave
wait_until survival == breather 3
give_card Explosive Tip
tp 0 0.9 18
look 0 -3
zombie walker 0 11
wait 0.2
fire 2
wait 0.3
assert bursts >= 1
end_wave
quit
