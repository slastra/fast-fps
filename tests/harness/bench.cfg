// Benchmark route: the same viewpoints every time, holding still at each while
// frame and GPU times are measured. Run it with scripts/bench.sh, which turns
// the "perf" lines into a table. In the suite it only has to finish.
vid_fullscreen 1
r_viewmodel 1
wait_until grounded == 1 5
sky dusk
wait 2

// 1. The whole arena from the north-east platform.
tp 24 3.9 24
look 45 -8
wait 1
perf_reset
wait 3
perf arena
screenshot bench_arena

// 2. Inside the keep by the campfire: the most lights in view.
tp 2.8 1.2 4.6
look 0 -10
wait 1
perf_reset
wait 3
perf campfire

// 3. Along the north wall: every merlon and trim block in one line.
tp -32 1.2 -33
look -90 2
wait 1
perf_reset
wait 3
perf wall

// 4. Over the wall at the far forest, from the south-east platform.
tp 24 3.9 -24
look -45 2
wait 1
perf_reset
wait 3
perf forest

// 5. A firefight: six bots running and shooting in the yard.
bot -4 0.9 12 180
bot -2 0.9 12 180
bot 0 0.9 12 180
bot 2 0.9 12 180
bot 4 0.9 12 180
bot 0 0.9 9 0
bot_do all run
bot_do all fire 400
tp 0 1.2 20
look 0 -4
wait 1
perf_reset
wait 3
perf firefight
bot_do all remove
wait 0.5

// The same overview and campfire at night, when the lamps carry the scene.
sky night
tp 24 3.9 24
look 45 -8
wait 1
perf_reset
wait 3
perf arena_night
tp 2.8 1.2 4.6
look 0 -10
wait 1
perf_reset
wait 3
perf campfire_night

// 7. A horde: survival, with 24 zombies coming across the yard at you.
sky dusk
mode survival
wait_until survival == wave 8
end_wave
wait_until survival == breather 3
tp 0 1.2 33
look 0 -4
zombie walker -7.5 14
zombie walker -4.5 14
zombie walker -1.5 14
zombie walker 1.5 14
zombie walker 4.5 14
zombie walker 7.5 14
zombie walker -7.5 17
zombie walker -4.5 17
zombie walker -1.5 17
zombie walker 1.5 17
zombie walker 4.5 17
zombie walker 7.5 17
zombie walker -7.5 20
zombie walker -4.5 20
zombie walker -1.5 20
zombie walker 1.5 20
zombie walker 4.5 20
zombie walker 7.5 20
zombie walker -7.5 23
zombie walker -4.5 23
zombie walker -1.5 23
zombie walker 1.5 23
zombie walker 4.5 23
zombie walker 7.5 23
wait 1
perf_reset
wait 3
perf horde

// 8. The same, with crawlers, bloaters and leapers in it.
end_wave
tp 0 1.2 33
look 0 -4
zombie crawler -7.5 14
zombie crawler -4.5 14
zombie crawler -1.5 14
zombie crawler 1.5 14
zombie crawler 4.5 14
zombie crawler 7.5 14
zombie crawler -7.5 17
zombie crawler -4.5 17
zombie bloater -1.5 17
zombie bloater 1.5 17
zombie bloater 4.5 17
zombie bloater 7.5 17
zombie bloater -7.5 20
zombie bloater -4.5 20
zombie leaper -1.5 20
zombie leaper 1.5 20
zombie leaper 4.5 20
zombie leaper 7.5 20
zombie leaper -7.5 23
zombie leaper -4.5 23
zombie walker -1.5 23
zombie walker 1.5 23
zombie walker 4.5 23
zombie walker 7.5 23
wait 1
perf_reset
wait 3
perf horde_mixed
mode ffa
quit
