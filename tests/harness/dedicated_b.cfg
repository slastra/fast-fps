// The second player on the dedicated server (see dedicated_a.cfg): the
// second duelist, who draws and wins the first round.
connect 127.0.0.1:27591
wait_until mode == client 20
r_ambient 12
sky day
wait_until players == 2 30
wait_until duel == walk 10
assert duel_me == duelist
assert duel_slot == 1
wait 0.5
tp 0 0.9 21
look 0 0
wait_until duel == steady 15
wait_until duel == draw 5
draw
wait 0.6
fire 1
wait_until duel_wins == 0-1 5
wait 0.3
screenshot dedicated_won
wait 1.5
quit
