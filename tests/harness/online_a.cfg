// Online play through the lobby. Run as:
//   scripts/harness.sh -L tests/harness/online_a.cfg tests/harness/online_b.cfg
// This side starts a duel in the lobby, which makes it the game's admin. It
// loses the first round, ends the duel with 'mode ffa', leaves, and checks
// the empty game shuts down and leaves the lobby.
lobby http://127.0.0.1:8099
create duel test duel
wait_until mode == client 20
r_ambient 12
sky day
wait_until players == 2 30
games
wait_until lobby_games == 1 5
wait_until duel == walk 10
assert duel_slot == 0
// An admin command, run by the server; it answers nothing when it works.
bot_duel_aim 0
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == steady 15
wait_until duel == draw 5
wait_until duel_wins == 0-1 8
wait 2
mode ffa
wait_until duel == none 5
wait 1
disconnect
wait_until mode == offline 5
// Empty, the game exits on its own (after 6 s under the harness).
wait 9
games
wait_until lobby_games == 0 5
quit
