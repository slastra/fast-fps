// A duel against a bot. Round 1: walk to the mark, find you can't walk off
// it, wait for "Draw!", draw, and take the bot's head off (it can't hit
// with bot_duel_aim 0). Round 2: the trigger does nothing before "Draw!",
// a shot fired the instant you draw goes into the ground, and a bot that
// always hits wins with two body shots. Rounds 3 and 4 take the duel 3-1, the loser goes to the
// back of the line and the second bot, who was watching, steps up. Then back
// to free-for-all.
r_ambient 12
sky day
mode duel
assert duel == waiting
bot -3 0.9 14
bot -4 0.9 14
bot_duel_aim 0
wait_until duel == walk 3
assert duel_me == duelist
assert duel_round == 1
assert weapon == flintlock
wait 0.5
screenshot duel_walk

// Walk to the mark; the bot walks to its own.
tp 0 0.9 9
wait_until on_mark == 1 3
look 180 -6
wait_until duel == steady 6
screenshot duel_steady
// Held on the mark: a step off (here a teleport 3 m away) is pulled back
// to within DUEL_ROOM (0.6 m) of its center.
tp 3 0.9 9
wait 0.2
assert x < 0.65
assert on_mark == 1
assert duel == steady
tp 0 0.9 9
look 180 0
wait_until duel == draw 5
// Holstered until drawn: no gun, no crosshair, and the trigger is dead.
assert holstered == 1
fire 1
wait 0.3
assert ammo == 1
screenshot duel_holstered
draw
wait 0.2
assert holstered == 0
assert raised < 1
screenshot duel_drawing
wait 0.4
assert raised == 1
screenshot duel_draw
fire 1
wait 0.05
assert ammo == 1
wait 0.2
assert ammo == 0
screenshot duel_smoke
wait_until duel == round_over 2
assert duel_wins == 1-0
assert ragdolls >= 1
wait 0.5
screenshot duel_round_won

// Round 2: no shooting before the bell.
wait_until duel == walk 5
assert duel_round == 2
assert out == 0
assert ammo == 1
fire 1
wait 0.5
assert ammo == 1
bot_duel_aim 1
tp 0 0.9 9
look 180 0
wait_until duel == draw 10
// Drawn and fired at once: the shot goes low, into the ground.
draw
fire 1
wait 0.4
assert ammo == 0
assert duel == draw
assert duel_wins == 1-0
wait_until duel == round_over 8
assert duel_wins == 1-1
assert out == 1
wait 0.3
screenshot duel_round_lost

// Rounds 3 and 4 go to you: 3-1 takes the duel.
bot_duel_aim 0
wait_until duel == walk 6
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == draw 10
draw
wait 0.6
fire 1
wait_until duel == round_over 3
wait_until duel == walk 6
wait 0.5
tp 0 0.9 9
look 180 0
wait_until duel == draw 10
draw
wait 0.6
fire 1
wait_until duel == round_over 3
assert duel_wins == 3-1
wait_until duel == over 5
wait 0.3
screenshot duel_over

// The winner stays and the next in line (bot2) steps up.
wait_until duel == walk 8
assert duel_round == 1
assert duel_wins == 0-0
assert duel_me == duelist
assert out == 0
wait 0.5
screenshot duel_next

// Back to free-for-all: everyone is in play again.
mode ffa
wait 0.3
assert duel == none
assert out == 0
quit
