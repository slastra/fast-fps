// The flintlock: the spark delay before the shot, 90 to the body so one
// ball doesn't kill, the slow reload, the smoke, and a bot holding one.
r_ambient 12
r_viewmodel 1
sky day
tp 0 1.2 17
look 0 -4
weapon flintlock
wait 0.9
assert weapon == flintlock
assert ammo == 1
screenshot flintlock_view

// A bot facing you, chest in the sights.
bot 0 0.9 9 180
bot_do all pin
bot_do all weapon flintlock
wait 0.5

// The spark burns for 0.15 s before the ball leaves.
fire 1
wait 0.05
assert ammo == 1
wait 0.2
assert ammo == 0
screenshot flintlock_smoke
wait 0.6
assert kills == 0

// Three seconds to reload, then a second ball finishes it.
reload
wait 1.5
assert reloading == 1
wait 1.8
assert reloading == 0
assert ammo == 1
fire 1
wait_until kills == 1 2

// Another bot, side on, to see the one-armed stance.
bot_do all remove
bot -1.5 0.9 12 90
bot_do all pin
bot_do all weapon flintlock
wait 0.6
screenshot flintlock_stance
quit
