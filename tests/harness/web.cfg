// The browser version only (scripts/web-harness.sh): a script fetched from
// the server with exec, the graphics presets, and a look at each. The frame
// rate after each change is printed (state fps) for docs/web.md.
exec cfg/bots.cfg
wait_until bots == 4 5
sky day
look 0 -5
wait 4
r_quality low
wait 4
state fps
screenshot web_low
r_quality medium
wait 4
state fps
screenshot web_medium
r_quality high
wait 4
state fps
screenshot web_high
assert fps > 15
quit
