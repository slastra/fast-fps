// Survival, solo and offline. A run starts with a Glock and a knife and no
// cards. Wave 1 brings 3 walkers through the first crack, north of the keep;
// stand on their route and shoot them, and the spare rounds go down. The
// breather offers three cards; take one. (Killed zombies sometimes drop
// ammo, so the spare count isn't checked.) Wave 2 opens a second crack.
// Then back to free-for-all, which puts everything back.
r_ambient 12
sky day
mode survival
wait_until survival == breather 3
assert wave == 0
assert cracks == 0
assert weapon == glock
assert owned == 2
assert spare == 60
assert cards == 0
assert dummies_down == 0

// Stand on the first crack's route and face it.
tp 3.94 0.9 -24
look 0 0
wait_until survival == wave 8
assert wave == 1
assert cracks == 1
assert zombies == 3
wait 2.5
screenshot survival_crack
// They come down the route at you, one after another.
wait 1.5
screenshot survival_walkers
fire 6
wait 1.2
fire 6
wait 1.2
fire 6
wait 1.2
reload
wait 2
fire 6
wait 1.2
fire 6
wait_until zombies == 0 15
assert health > 0
assert kills == 3

wait_until survival == breather 4
assert wave == 1
assert offer == 3
wait 0.5
screenshot survival_cards
// The crack stays open: a close look.
tp 3.94 0.9 -31
look 0 4
wait 0.3
screenshot survival_crack_near
pick 1
wait 0.3
assert offer == 0
assert cards >= 0
next_wave
wait_until survival == wave 3
assert wave == 2
assert cracks == 2
assert zombies == 5

mode ffa
wait 0.5
assert survival == none
assert weapon == glock
assert spare == -1
quit
