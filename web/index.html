<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fast-fps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0d10'/%3E%3Cpath d='M8 3v10M3 8h10' stroke='%23f2994a' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d10;
    --text: #e8e6e1;
    --dim: #9a978f;
    --accent: #f2994a;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
    overflow: hidden;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }
  #notice {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    text-align: center;
    /* Clicks go through to the game, which takes the mouse on click. */
    pointer-events: none;
  }
  #notice h1 {
    margin: 0;
    font-size: 40px;
    letter-spacing: 0.02em;
  }
  #notice h1 span { color: var(--accent); }
  #notice p { margin: 0; color: var(--dim); max-width: 34em; }
  #notice .go { color: var(--text); font-weight: 600; }
  #notice.gone { display: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="notice">
  <h1>fast<span>-</span>fps</h1>
  <p id="status">Loading the game…</p>
</div>
<script type="module">
  const notice = document.getElementById("notice");
  const status = document.getElementById("status");
  const say = (html) => { status.innerHTML = html; };

  // Browsers keep sound off until the page is clicked. Remember every audio
  // context the game makes and wake them all on the first click.
  const contexts = [];
  const Native = window.AudioContext;
  if (Native) {
    window.AudioContext = function (...args) {
      const ctx = new Native(...args);
      contexts.push(ctx);
      return ctx;
    };
    window.AudioContext.prototype = Native.prototype;
  }
  addEventListener("pointerdown", () => {
    for (const ctx of contexts) ctx.resume();
    notice.classList.add("gone");
    document.getElementById("game").focus();
  });

  if (!navigator.gpu) {
    say("This browser has no WebGPU, which the game needs. " +
        "Try a recent Chrome or Edge.");
  } else {
    let started = false;
    try {
      const { default: init } = await import("./fast-fps.js");
      await init();
      started = true;
    } catch (e) {
      // Bevy ends its setup with this on purpose; the game keeps running.
      started = String(e).includes("Using exceptions for control flow");
      if (!started) {
        say("The game stopped with an error. The browser's console has details.");
        throw e;
      }
    }
    // The game is running: invite the click that grabs the mouse and turns
    // the sound on.
    if (started) {
      say('<span class="go">Click to play.</span> ' +
          "Press ~ for the console, Esc to let go of the mouse.");
    }
  }
</script>
</body>
</html>
