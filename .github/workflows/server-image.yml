# Builds the online server image (Dockerfile: the lobby and the headless
# game) on every push to master, publishes it to the GitHub container
# registry, and asks Coolify to redeploy it. See docs/online.md.
name: Server image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fast-fps-server:latest
            ghcr.io/${{ github.repository_owner }}/fast-fps-server:${{ github.sha }}
          # Keep the dependency layer between runs, so only the game rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Optional: set the COOLIFY_DEPLOY_URL and COOLIFY_TOKEN secrets (a
      # Coolify API token with deploy permission) to redeploy on each build.
      - name: Redeploy on Coolify
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: env.COOLIFY_DEPLOY_URL != ''
        run: curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"
